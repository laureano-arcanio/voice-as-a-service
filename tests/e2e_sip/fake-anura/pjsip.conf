; Anura falso del entorno e2e (docker-compose.e2e-sip.yml): hace de troncal para nuestro Asterisk.
; Escucha en 200.13.42.10, una IP de las redes de Anura (pjsip.conf, identify del endpoint anura),
; puesta en el loopback de la red aislada: asi nuestro Asterisk corre con su config de produccion.
; Como Anura: acepta el REGISTER y desafia los INVITE con el usuario y la clave de la troncal.

[global]
type=global
user_agent=fake-anura

[transport-udp]
type=transport
protocol=udp
bind=200.13.42.10:55090

[e2e-user]
type=auth
auth_type=userpass
username=e2e-user
password=e2e-pass

[e2e-user]
type=aor
max_contacts=1
remove_existing=yes

; El nombre es el usuario de la troncal: nuestro Asterisk manda From: e2e-user (from_user).
[e2e-user]
type=endpoint
transport=transport-udp
context=from-atentina
aors=e2e-user
auth=e2e-user
disallow=all
allow=alaw
dtmf_mode=rfc4733
direct_media=no
media_address=200.13.42.10
bind_rtp_to_media_address=yes
rtp_symmetric=yes
