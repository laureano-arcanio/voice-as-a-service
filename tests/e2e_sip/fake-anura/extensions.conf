; Destinos del Anura falso. Nuestro Asterisk marca los 10 digitos ([to-anura]); cada numero es un
; caso de docs/DERIVACIONES_PLAN.md (secciones 4.1 y 8). Los audios son del TTS propio (../audio/).

[general]
static=yes
writeprotect=yes

[from-atentina]
; Persona que atiende, escucha el whisper, marca 1, habla y despues marca 2 (vuelta a la IA).
exten => 3510000001,1,Answer()
 same => n,Wait(4)
 same => n,SendDTMF(1)
 same => n,Playback(/sounds/e2e/persona)
 same => n,Wait(1)
 same => n,SendDTMF(2)
 same => n,Wait(8)
 same => n,Hangup()
; Ocupado (486).
exten => 3510000002,1,Busy(5)
; Suena y nadie atiende.
exten => 3510000003,1,Ringing()
 same => n,Wait(120)
; Atiende un buzon (como el de Claro: atiende y habla).
exten => 3510000004,1,Answer()
 same => n,Playback(/sounds/e2e/buzon)
 same => n,Wait(10)
 same => n,Hangup()
; Congestion (503).
exten => 3510000005,1,Congestion(5)
; Atiende y no marca nada.
exten => 3510000006,1,Answer()
 same => n,Wait(40)
 same => n,Hangup()
; Atiende y corta enseguida (durante el whisper).
exten => 3510000007,1,Answer()
 same => n,Wait(2)
 same => n,Hangup()
; Atiende y devuelve lo que escucha (eco): audio en los dos sentidos (llamadas directas, tests/e2e_sip/direct.py).
exten => 3510000008,1,Answer()
 same => n,Echo()
; Cualquier otro numero: un cliente que atiende, habla y espera.
exten => _X.,1,Answer()
 same => n,Playback(/sounds/e2e/cliente)
 same => n,Wait(60)
 same => n,Hangup()
