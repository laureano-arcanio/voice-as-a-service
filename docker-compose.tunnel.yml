# Entrada publica de la demo de la landing por Cloudflare Tunnel (docs/LANDING.md):
# api.atentina.com.ar -> app (:8011, solo /api/v1/demo/*) y rtc.atentina.com.ar ->
# senalizacion de LiveKit (:7880). Las rutas del tunel se configuran en Cloudflare
# (tunel administrado por token). El audio WebRTC no pasa por el tunel: va por UDP
# 7882 / TCP 7881 reenviados en el router, con LIVEKIT_NODE_IP = IP publica.
#
# Se activa sumandolo a COMPOSE_FILE en .env, o con `make up-tunnel`.

services:
  tunnel:
    image: cloudflare/cloudflared:2026.9.0
    restart: unless-stopped
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?falta CLOUDFLARE_TUNNEL_TOKEN en .env}
