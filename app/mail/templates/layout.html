<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>$title</title>
</head>
<body style="margin:0;padding:0;background:$bg;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:$bg;">$preheader</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:$bg;">
<tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
    <!-- Cabecera -->
    <tr><td style="background:$ink;border-radius:12px 12px 0 0;padding:22px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
        <td valign="middle" style="padding-right:12px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
            <td valign="middle" width="6" height="12" style="width:6px;height:12px;background:$accent_on_dark;border-radius:3px;font-size:0;line-height:0;">&nbsp;</td>
            <td width="3" style="width:3px;font-size:0;">&nbsp;</td>
            <td valign="middle" width="6" height="22" style="width:6px;height:22px;background:$accent_on_dark;border-radius:3px;font-size:0;line-height:0;">&nbsp;</td>
            <td width="3" style="width:3px;font-size:0;">&nbsp;</td>
            <td valign="middle" width="6" height="12" style="width:6px;height:12px;background:$accent_on_dark;border-radius:3px;font-size:0;line-height:0;">&nbsp;</td>
          </tr></table>
        </td>
        <td valign="middle" style="font-family:$font;font-size:24px;font-weight:800;letter-spacing:-0.02em;color:$cta_ink;">Atentina</td>
      </tr></table>
    </td></tr>
    <!-- Contenido -->
    <tr><td style="background:#ffffff;border-left:1px solid $line;border-right:1px solid $line;padding:32px;font-family:$font;font-size:16px;line-height:1.6;color:$ink_2;">
$content
    </td></tr>
    <!-- Pie -->
    <tr><td style="background:$bg_2;border:1px solid $line;border-radius:0 0 12px 12px;padding:20px 32px;font-family:$font;font-size:13px;line-height:1.6;color:$muted;">
      <strong style="color:$ink;">Atentina</strong> &middot; Agentes con IA que atienden a tus clientes, por teléfono y WhatsApp.<br>
      <a href="$site_url" style="color:$accent;text-decoration:none;">$site_host</a> &middot;
      <a href="mailto:$support_email" style="color:$accent;text-decoration:none;">$support_email</a><br>
      <span style="color:$muted;">$reason</span>
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
