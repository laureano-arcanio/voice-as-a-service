# Config de prueba para llamadas reales: STT Parakeet + TTS CosyVoice3, en
# lugar de vllm-stt (Qwen3-ASR) + vllm-tts (Qwen3-TTS).
#
#   GPU 0: tts-cosyvoice sola (0.45 + 0.25 en tts/cosyvoice3.yaml) -- vllm-tts apagado.
#   GPU 1: vllm-llm (0.55) + stt-parakeet (~1.6GB) + escritorio -- vllm-stt apagado.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.parakeet-cosyvoice.yml \
#     --profile stt-eval --profile tts-eval up -d --wait \
#     db vllm-llm stt-parakeet tts-cosyvoice app agent
#
# El .env apunta el agente a los dos servicios (VLLM_STT_BASE_URL/AGENT_STT_MODEL
# y VLLM_TTS_BASE_URL/VLLM_TTS_MODEL/VLLM_TTS_VOICE). Volver a la config vigente:
# restaurar esas lineas del .env y `make up`.
services:
  # Parakeet a la GPU 1, en el lugar de vllm-stt (mismo criterio que
  # docker-compose.stt-candidates.yml, ver ese archivo).
  stt-parakeet:
    depends_on:
      vllm-llm:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["1"]
              capabilities: ["gpu"]

  tts-cosyvoice:
    # Sin --no-async-chunk: para una llamada hace falta streaming (el default
    # de la imagen, async_chunk: true en tts/cosyvoice3.yaml). El flag que
    # tiene en el compose principal es para la generacion offline del corpus.
    command: !override
      - "vllm"
      - "serve"
      - "${COSYVOICE_MODEL:-FunAudioLLM/Fun-CosyVoice3-0.5B-2512}"
      - "--host=0.0.0.0"
      - "--port=8000"
      - "--api-key=${VLLM_API_KEY:-not-needed}"
      - "--trust-remote-code"
      - "--omni"
      - "--deploy-config=/config/cosyvoice3.yaml"
    volumes: !override
      - hf_cache:/root/.cache/huggingface
      # Config propia de llamada (streaming), no la del corpus: ver
      # tts/cosyvoice3-live.yaml.
      - ./tts/cosyvoice3-live.yaml:/config/cosyvoice3.yaml:ro
      # CosyVoice3 exige ref_audio + ref_text en cada request, pero acepta
      # voces subidas por POST /v1/audio/voices igual que Qwen3-TTS (el
      # adapter resuelve `voice` contra las subidas antes de validar). Sin
      # este volumen la voz se pierde al recrear el contenedor. Volumen
      # propio, separado de vllm_tts_speakers: los speakers de Qwen3-TTS
      # guardan embeddings de otro modelo.
      - cosyvoice_speakers:/root/.cache/vllm-omni/speakers

  agent:
    # vllm-stt / vllm-tts quedan apagados en esta config.
    depends_on: !override
      db:
        condition: service_healthy
      vllm-llm:
        condition: service_healthy
      stt-parakeet:
        condition: service_healthy
      tts-cosyvoice:
        condition: service_healthy

  app:
    depends_on: !override
      db:
        condition: service_healthy
      vllm-llm:
        condition: service_healthy

volumes:
  cosyvoice_speakers:
