# EXPERIMENTO: STT candidatos (Parakeet TDT 0.6B v3, Whisper Large v3 Turbo)
# en lugar de vllm-stt, en el lugar que ocupa hoy: GPU 1 con vllm-llm +
# escritorio (reparto de EXP-003). TTS sigue sola en la GPU 0 (ver
# AGENTS.md). Los 2 quedan arriba a la vez, y el loadtest (en otra PC)
# elige a cual pegarle con VLLM_STT_BASE_URL/VLLM_STT_MODEL en SU .env:
#   https://$NGROK_DOMAIN/stt-parakeet/v1   nvidia/parakeet-tdt-0.6b-v3
#   https://$NGROK_DOMAIN/stt-whisper/v1    openai/whisper-large-v3-turbo
# y `docker compose up -d --no-deps agent` alla para que relea el .env.
#
# Uso (se apaga vllm-stt: libera los ~7GB de la GPU 1 que ocupan los candidatos):
#   docker compose stop vllm-stt
#   docker compose -f docker-compose.yml -f docker-compose.stt-candidates.yml \
#     --profile stt-eval --profile ngrok up -d --build \
#     vllm-llm vllm-tts stt-whisper stt-parakeet proxy ngrok
# Volver a la config vigente:
#   make stt-eval-down
#   docker compose --profile ngrok up -d vllm-llm vllm-stt vllm-tts proxy ngrok
#
# Presupuesto de la GPU 1 (24GB): escritorio ~1.3 + vllm-llm 0.55 (~13.2) +
# stt-whisper 0.16 (~3.9) + stt-parakeet ~1.6 = ~20GB.
services:
  stt-whisper:
    # Comparte GPU con vllm-llm: arranca despues (ver comentario de
    # depends_on en vllm-stt, compose principal).
    depends_on:
      vllm-llm:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["1"]
              capabilities: ["gpu"]

  stt-parakeet:
    # Y despues de stt-whisper, que como todo vLLM mide la memoria libre al
    # arrancar.
    depends_on:
      stt-whisper:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["1"]
              capabilities: ["gpu"]

  proxy:
    # Sin vllm-stt, que queda apagado en este experimento.
    depends_on: !override
      vllm-llm:
        condition: service_healthy
      vllm-tts:
        condition: service_healthy
