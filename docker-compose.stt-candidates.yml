# EXPERIMENTO: STT candidatos (Parakeet TDT 0.6B v3, Whisper Large v3 Turbo)
# en lugar de vllm-stt, en el lugar que ocupa hoy: GPU 1 con vllm-llm +
# escritorio (reparto de EXP-003). TTS sigue sola en la GPU 0 (ver
# AGENTS.md). Se mide UNO por vez, como quedaria en produccion: asi la VRAM
# y el meta.json del sampler reflejan solo el STT probado. El loadtest (en
# otra PC) le pega con VLLM_STT_BASE_URL/VLLM_STT_MODEL en SU .env:
#   http://$PUBLIC_HOST:$PROXY_PORT/stt-parakeet/v1   nvidia/parakeet-tdt-0.6b-v3
#   http://$PUBLIC_HOST:$PROXY_PORT/stt-whisper/v1    openai/whisper-large-v3-turbo
#
# Uso: `make servers-whisper` / `make servers-parakeet` (y `make servers-qwen`
# para la config vigente); ver el Makefile. Volver al uso normal:
# `make servers-qwen && make up`. Runbook: docs/experiments/README.md,
# seccion "STT candidatos".
#
# Presupuesto de la GPU 1 (24GB): escritorio ~1.3 + vllm-llm 0.55 (~13.2) +
# stt-whisper 0.16 (~3.9) o stt-parakeet ~1.6.
services:
  stt-whisper:
    # Comparte GPU con vllm-llm: arranca despues (ver comentario de
    # depends_on en vllm-stt, compose principal).
    depends_on:
      vllm-llm:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["1"]
              capabilities: ["gpu"]

  stt-parakeet:
    # Idem stt-whisper.
    depends_on:
      vllm-llm:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["1"]
              capabilities: ["gpu"]
