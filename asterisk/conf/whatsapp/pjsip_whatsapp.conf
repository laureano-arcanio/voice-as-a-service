; PJSIP: llamadas de WhatsApp (Calling API por SIP) -> Asterisk -> LiveKit.
; Template: entrypoint.sh lo renderiza a /etc/asterisk/pjsip_whatsapp.conf solo
; si hay WA_SIP_PASSWORD y certificado (make sip-cert). Ver docs/WHATSAPP_PLAN.md, fase 5.
;
; Lo que pide Meta: SIP sobre TLS con un certificado valido para WA_SIP_HOST
; (sin mTLS) y audio SRTP. El numero se configura con SDES y PCMA
; (make wa-calling-enable): Asterisk no transcodifica, como con Anura.

; El router redirige ${WA_SIP_PORT}/tcp a este host; el audio usa el mismo rango
; RTP que Anura (ya redirigido). Meta llega desde internet: se anuncia la IP
; publica para senalizacion y audio.
[transport-whatsapp]
type=transport
protocol=tls
bind=0.0.0.0:${WA_SIP_PORT}
cert_file=/etc/asterisk/keys/whatsapp-fullchain.pem
priv_key_file=/etc/asterisk/keys/whatsapp-privkey.pem
; Sin method, pjproject sirve solo TLS 1.0 (medido el 6-oct-2026; Meta lo aceptaba).
; sslv23 = negociar: con el OpenSSL de Alpine da TLS 1.2 y 1.3, y ya no 1.0.
method=sslv23
external_signaling_address=${ASTERISK_PUBLIC_ADDRESS}
external_signaling_port=${WA_SIP_PORT}
external_media_address=${ASTERISK_PUBLIC_ADDRESS}
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; Meta responde al desafio de digest con la clave que genera para el numero
; (make wa-sip-password) y con el numero del negocio como usuario: con el 9 y
; sin + (5493517002592, confirmado el 6-oct-2026). identify_by=auth_username
; asocia ese usuario al endpoint del mismo nombre (igual que "livekit"). Con
; otro numero, `pjsip set logger on` muestra el username: ponerlo en WA_SIP_USER.
[whatsapp-auth]
type=auth
auth_type=userpass
username=${WA_SIP_USER}
password=${WA_SIP_PASSWORD}

[${WA_SIP_USER}]
type=endpoint
transport=transport-whatsapp
context=from-whatsapp
auth=whatsapp-auth
identify_by=auth_username
disallow=all
allow=alaw
media_encryption=sdes
media_encryption_optimistic=no
rtcp_mux=yes
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_timeout=60
language=es
