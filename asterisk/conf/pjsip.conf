; PJSIP: troncal Anura <-> Asterisk <-> LiveKit Cloud.
; Template: entrypoint.sh reemplaza las ${VARIABLES} con los valores de .env.
; Ver docs/TELEFONIA_ANURA.md.
;
; Codec: solo G.711 A-law (PCMA) en las dos patas. Es lo unico que acepta
; Anura (allow=alaw en su doc) y LiveKit lo soporta nativo, asi que Asterisk
; no transcodifica: solo reenvia el RTP.

[global]
type=global
user_agent=voice-as-a-service

; --- Transportes ----------------------------------------------------------
; Asterisk corre con network_mode: host detras del NAT del router, y hay un
; transporte por cada lado porque cada uno necesita anunciar el audio distinto.
;
; El router (Huawei de Telecom) cambia el puerto de origen de todo lo que sale.
; Si Asterisk le manda RTP a LiveKit antes de que llegue el primer paquete de
; LiveKit, el router crea esa traduccion y despues descarta lo que LiveKit
; manda al puerto anunciado en el SDP: el cliente no escucha al agente (probado:
; 0 paquetes recibidos si Asterisk habla primero, ~300 si no). LiveKit Cloud
; hace RTP simetrico (le contesta a la direccion desde la que recibe) solo si
; el SDP trae una IP privada, asi que hacia LiveKit NO se anuncia la publica.

; LiveKit: el router redirige ${ASTERISK_SIP_PORT}/udp y el rango RTP a este
; host (el trunk saliente de LiveKit apunta a <IP publica>:${ASTERISK_SIP_PORT}).
; Senalizacion con la IP publica, audio con la IP de la LAN (ver arriba).
[transport-livekit]
type=transport
protocol=udp
bind=0.0.0.0:${ASTERISK_SIP_PORT}
external_signaling_address=${ASTERISK_PUBLIC_ADDRESS}
external_signaling_port=${ASTERISK_SIP_PORT}
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; Anura: anuncia la IP publica tambien para el audio. Este puerto no hace falta
; redirigirlo en el router: Anura le manda las llamadas a la direccion que
; aprendio del REGISTER (el agujero que abre el NAT), no al puerto anunciado.
[transport-anura]
type=transport
protocol=udp
bind=0.0.0.0:${ASTERISK_ANURA_SIP_PORT}
external_signaling_address=${ASTERISK_PUBLIC_ADDRESS}
external_signaling_port=${ASTERISK_ANURA_SIP_PORT}
external_media_address=${ASTERISK_PUBLIC_ADDRESS}
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; --- Anura (proveedor PSTN) -------------------------------------------------
; Datos de la troncal segun la KB de Anura (configuracion Elastix/FreePBX):
;   registro: USER@DOMINIO.grancentral.com.ar:PASS@...:55090/DID
;   allow=alaw, dtmfmode=rfc2833, permit de sus 4 redes.
[anura-auth]
type=auth
auth_type=userpass
username=${ANURA_USER}
password=${ANURA_PASSWORD}

; El registro es lo que hace que Anura nos mande las llamadas entrantes: las
; envia a sip:${ANURA_DID}@<nuestra IP publica>:${ASTERISK_SIP_PORT}.
[anura]
type=registration
transport=transport-anura
outbound_auth=anura-auth
server_uri=sip:${ANURA_DOMAIN}:${ANURA_PORT}
client_uri=sip:${ANURA_USER}@${ANURA_DOMAIN}:${ANURA_PORT}
contact_user=${ANURA_DID}
expiration=120
retry_interval=30
forbidden_retry_interval=300
fatal_retry_interval=300
max_retries=1000000
line=yes
endpoint=anura

[anura]
type=aor
contact=sip:${ANURA_DOMAIN}:${ANURA_PORT}
qualify_frequency=60

[anura]
type=endpoint
transport=transport-anura
context=from-anura
aors=anura
; Anura desafia nuestros INVITE salientes; sus INVITE entrantes no los
; desafiamos (equivale a insecure=invite): los identifica la IP (identify de abajo).
outbound_auth=anura-auth
; From = usuario de la terminal, igual que un telefono IP registrado. Anura
; igual identifica la terminal por la autenticacion, y el caller ID que sale a
; la red es el numero principal de la cuenta.
from_user=${ANURA_USER}
from_domain=${ANURA_DOMAIN}
disallow=all
allow=alaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_timeout=60
language=es

; Redes de Anura (AS52275), de su doc "Requisitos de instalacion".
[anura]
type=identify
endpoint=anura
match=179.0.14.0/24
match=200.13.42.0/24
match=200.13.43.0/24
match=200.33.82.0/24

; --- LiveKit Cloud ---------------------------------------------------------
; Un solo par de credenciales en los dos sentidos:
;  - Asterisk -> LiveKit (entrantes): LiveKit desafia y Asterisk responde con
;    outbound_auth. Mismo usuario/clave en el inbound trunk de LiveKit.
;  - LiveKit -> Asterisk (salientes del agente): LiveKit Cloud sale desde IPs
;    que no son fijas en Sudamerica, asi que no se lo puede identificar por IP.
;    El primer INVITE no identificado recibe un 401; LiveKit reintenta con
;    Authorization y identify_by=auth_username lo asocia a este endpoint (por
;    eso el nombre del endpoint TIENE que ser igual al usuario: "livekit").
[livekit-auth]
type=auth
auth_type=userpass
username=livekit
password=${LIVEKIT_SIP_PASSWORD}

[livekit]
type=aor
contact=sip:${LIVEKIT_SIP_HOST}
; LiveKit no garantiza responder OPTIONS: con qualify, un timeout marcaria el
; endpoint como no disponible y el Dial fallaria.
qualify_frequency=0

[livekit]
type=endpoint
transport=transport-livekit
context=from-livekit
aors=livekit
auth=livekit-auth
outbound_auth=livekit-auth
identify_by=auth_username
disallow=all
allow=alaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_timeout=60
; Si Asterisk no tiene audio para mandar, igual manda un paquete por segundo:
; LiveKit necesita recibir algo para aprender a donde contestar (ver transportes).
rtp_keepalive=1
language=es
