; Dialplan: Anura <-> LiveKit Cloud. Ver docs/TELEFONIA_ANURA.md.
; Template: entrypoint.sh reemplaza SOLO ${ANURA_DID} y ${ANURA_DOMAIN}; las
; variables propias del dialplan (${EXTEN}, ${CALLERID(num)}, ...) quedan igual.
;
; Solo hay dos contextos de entrada, uno por endpoint de pjsip.conf:
;   from-anura   <- endpoint anura   (identificado por IP de Anura)
;   from-livekit <- endpoint livekit (identificado por usuario/clave)
; Cualquier otro request SIP no llega al dialplan: no hay endpoint anonimo.

[general]
static=yes
writeprotect=yes

; --- Entrantes: PSTN -> Anura -> Asterisk -> LiveKit -> agente --------------
; Anura manda la llamada a sip:${ANURA_DID}@... (contact_user del registro). Hay
; una sola troncal, asi que cualquier destino va al mismo numero en LiveKit:
; +54${ANURA_DID}, que tiene que coincidir con `numbers` del inbound trunk de
; LiveKit (scripts/livekit_sip_setup.py). La dispatch rule de ese trunk crea
; una room por llamada y despacha al agente (LIVEKIT_AGENT_NAME).
[from-anura]
exten => _X.,1,Goto(anura-inbound,s,1)
exten => _+X.,1,Goto(anura-inbound,s,1)
exten => s,1,Goto(anura-inbound,s,1)

[anura-inbound]
exten => s,1,Verbose(1,Entrante de Anura: ${CALLERID(num)} -> +54${ANURA_DID})
 same => n,Gosub(cid-to-e164,s,1)
 same => n,Dial(PJSIP/+54${ANURA_DID}@livekit,60)
 same => n,Hangup(${HANGUPCAUSE})

; Caller ID de Anura -> E.164, que es lo que LiveKit pone en el atributo
; sip.phoneNumber y el agente guarda como telefono de la llamada entrante.
; Best effort: no hay forma de distinguir un celular de un fijo en 10 digitos.
[cid-to-e164]
exten => s,1,Set(NUM=${FILTER(0-9,${CALLERID(num)})})
 same => n,ExecIf($["${CALLERID(num):0:1}" = "+"]?Return())
 same => n,GotoIf($[${LEN(${NUM})} = 10]?nac10)
 same => n,GotoIf($[${LEN(${NUM})} = 11 & "${NUM:0:1}" = "0"]?nac11)
 same => n,GotoIf($["${NUM:0:2}" = "54"]?intl)
 same => n,Return()
 same => n(nac10),Set(CALLERID(num)=+54${NUM})
 same => n,Return()
 same => n(nac11),Set(CALLERID(num)=+54${NUM:1})
 same => n,Return()
 same => n(intl),Set(CALLERID(num)=+${NUM})
 same => n,Return()

; --- Salientes: agente -> LiveKit -> Asterisk -> Anura -> PSTN --------------
; LiveKit manda el numero tal cual lo paso el agente en sip_call_to (el
; dashboard lo pide en E.164). Anura marca en formato nacional de 10 digitos
; (caracteristica + abonado), sin 0, sin 15 y sin 54 -- tambien los celulares
; (ver "Llamadas salientes desde Twilio usando Anura" en su KB).
[from-livekit]
; Celular E.164: +54 9 + 10 digitos (el 9 es el prefijo movil internacional).
exten => _+549XXXXXXXXXX,1,Goto(to-anura,${EXTEN:4},1)
; Fijo E.164: +54 + 10 digitos.
exten => _+54XXXXXXXXXX,1,Goto(to-anura,${EXTEN:3},1)
; Lo mismo sin el +.
exten => _549XXXXXXXXXX,1,Goto(to-anura,${EXTEN:3},1)
exten => _54XXXXXXXXXX,1,Goto(to-anura,${EXTEN:2},1)
; Nacional: 0 + 10 digitos, o los 10 digitos pelados.
exten => _0XXXXXXXXXX,1,Goto(to-anura,${EXTEN:1},1)
exten => _XXXXXXXXXX,1,Goto(to-anura,${EXTEN},1)
; Todo lo demas (internacional, numeros cortos, formato desconocido) se
; rechaza con 403: solo se llama a Argentina, y corta de raiz el fraude de
; llamadas internacionales si alguna vez se filtraran las credenciales.
exten => _X.,1,Goto(rejected,s,1)
exten => _+X.,1,Goto(rejected,s,1)

[rejected]
exten => s,1,Verbose(1,Saliente RECHAZADA, destino no argentino o formato desconocido: ${CALLERID(dnid)})
 same => n,Hangup(21)

[to-anura]
exten => _XXXXXXXXXX,1,Verbose(1,Saliente a Anura: ${EXTEN} (caller ID ${ANURA_DID}))
 same => n,Set(CALLERID(num)=${ANURA_DID})
 same => n,Set(CALLERID(name)=)
 same => n,Dial(PJSIP/${EXTEN}@anura,60,b(anura-predial^s^1))
 same => n,Hangup(${HANGUPCAUSE})

; Corre sobre el canal saliente hacia Anura, antes de mandar el INVITE.
; X-Anura-Realm: header que Anura pide para identificar el dominio de la
; cuenta en su doc de troncal saliente (Twilio -> Anura).
[anura-predial]
exten => s,1,Set(PJSIP_HEADER(add,X-Anura-Realm)=${ANURA_DOMAIN})
 same => n,Return()
