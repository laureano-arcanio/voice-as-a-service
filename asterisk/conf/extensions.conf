; Dialplan: Anura <-> LiveKit Cloud. Ver docs/TELEFONIA_ANURA.md.
; Template: entrypoint.sh reemplaza SOLO ${ANURA_DID} y ${ANURA_DOMAIN}; las
; variables propias del dialplan (${EXTEN}, ${CALLERID(num)}, ...) quedan igual.
;
; Hay tres contextos de entrada, uno por endpoint de pjsip.conf:
;   from-anura    <- endpoint anura    (identificado por IP de Anura)
;   from-livekit  <- endpoint livekit  (identificado por usuario/clave)
;   from-whatsapp <- endpoint de Meta  (por usuario/clave, pjsip_whatsapp.conf; solo llega a LiveKit)
; Cualquier otro request SIP no llega al dialplan: no hay endpoint anonimo.

[general]
static=yes
writeprotect=yes

; Tope duro de cada llamada, en ms, para Dial L(): corta aunque el worker de voz
; se caiga sin colgar. Igual a CALL_DURATION_CEILING_SECONDS (app/config.py) x 1000,
; que tambien es el max_call_duration del trunk entrante de LiveKit
; (scripts/livekit_sip_setup.py). El corte normal lo hace antes el worker, con el
; tope del tier (max_call_duration_seconds) y la despedida.
[globals]
CALL_CEILING_MS=3600000

; --- Entrantes: PSTN -> Anura -> Asterisk -> LiveKit -> agente --------------
; Anura manda el numero marcado en la Request-URI, en formato nacional con 0
; (sip:03517003976@..., tambien en P-Asserted-Identity; verificado 29-sep-2026
; con los dos DIDs de la cuenta). Se pasa a LiveKit en E.164 (+54 + 10 digitos):
; tiene que estar en `numbers` del inbound trunk (make livekit-sip, que los toma
; de phone_numbers) y la app rutea al agente de ese numero (app/voice/worker.py).
; Si no viene un numero valido (ej. sip:3517002592, el usuario de registro, o
; sin usuario), se usa ANURA_DID como antes.
[from-anura]
exten => _X.,1,Set(DIALED=${EXTEN})
 same => n,Goto(anura-inbound,s,1)
exten => _+X.,1,Set(DIALED=${EXTEN})
 same => n,Goto(anura-inbound,s,1)
exten => s,1,Goto(anura-inbound,s,1)

[anura-inbound]
exten => s,1,Set(DID=${FILTER(0-9,${DIALED})})
 same => n,ExecIf($[${LEN(${DID})} = 11 & "${DID:0:1}" = "0"]?Set(DID=${DID:1}))
 same => n,ExecIf($[${LEN(${DID})} = 12 & "${DID:0:2}" = "54"]?Set(DID=${DID:2}))
 same => n,ExecIf($[${LEN(${DID})} != 10]?Set(DID=${ANURA_DID}))
 same => n,Verbose(1,Entrante de Anura: ${CALLERID(num)} -> +54${DID} (marcado: ${DIALED}))
 same => n,Gosub(cid-to-e164,s,1)
 same => n,Dial(PJSIP/+54${DID}@livekit,60,L(${CALL_CEILING_MS}))
 same => n,Hangup(${HANGUPCAUSE})

; Caller ID de Anura -> E.164, que es lo que LiveKit pone en el atributo
; sip.phoneNumber y el agente guarda como telefono de la llamada entrante.
; Best effort: no hay forma de distinguir un celular de un fijo en 10 digitos.
[cid-to-e164]
exten => s,1,Set(NUM=${FILTER(0-9,${CALLERID(num)})})
 same => n,ExecIf($["${CALLERID(num):0:1}" = "+"]?Return())
 same => n,GotoIf($[${LEN(${NUM})} = 10]?nac10)
 same => n,GotoIf($[${LEN(${NUM})} = 11 & "${NUM:0:1}" = "0"]?nac11)
 same => n,GotoIf($["${NUM:0:2}" = "54"]?intl)
 same => n,Return()
 same => n(nac10),Set(CALLERID(num)=+54${NUM})
 same => n,Return()
 same => n(nac11),Set(CALLERID(num)=+54${NUM:1})
 same => n,Return()
 same => n(intl),Set(CALLERID(num)=+${NUM})
 same => n,Return()

; --- Entrantes: WhatsApp -> Meta (SIP/TLS) -> Asterisk -> LiveKit -> agente --
; Meta manda el numero del negocio en la Request-URI, en E.164 con + (puede
; venir con el 9 movil: Meta muestra +54 9 351... aunque sea un fijo de Anura).
; El caller ID es el WhatsApp del usuario, ya en E.164 con +. Se pasa a LiveKit
; con el mismo DID que la entrante de Anura: lo atiende el agente de ese numero.
; Un numero que no se puede leer como argentino de 10 digitos se corta (no cae en
; ANURA_DID: seria el agente de Atentina atendiendo la llamada de otro negocio).
[from-whatsapp]
exten => _X.,1,Set(DIALED=${EXTEN})
 same => n,Goto(whatsapp-inbound,s,1)
exten => _+X.,1,Set(DIALED=${EXTEN})
 same => n,Goto(whatsapp-inbound,s,1)
exten => s,1,Goto(whatsapp-inbound,s,1)

[whatsapp-inbound]
exten => s,1,Set(DID=${FILTER(0-9,${DIALED})})
 same => n,ExecIf($[${LEN(${DID})} = 13 & "${DID:0:3}" = "549"]?Set(DID=${DID:3}))
 same => n,ExecIf($[${LEN(${DID})} = 12 & "${DID:0:2}" = "54"]?Set(DID=${DID:2}))
 same => n,GotoIf($[${LEN(${DID})} != 10]?unknown)
 same => n,Verbose(1,Entrante de WhatsApp: ${CALLERID(num)} -> +54${DID} (marcado: ${DIALED}, wacid: ${PJSIP_HEADER(read,x-wa-meta-wacid)}))
 same => n,Gosub(cid-to-e164,s,1)
 same => n,Dial(PJSIP/+54${DID}@livekit,60,L(${CALL_CEILING_MS}))
 same => n,Hangup(${HANGUPCAUSE})
 same => n(unknown),Verbose(1,Entrante de WhatsApp RECHAZADA, numero marcado desconocido: ${DIALED} (de ${CALLERID(num)}))
 same => n,Hangup(1)

; --- Salientes: agente -> LiveKit -> Asterisk -> Anura -> PSTN --------------
; LiveKit manda el numero tal cual lo paso el agente en sip_call_to (el
; dashboard lo pide en E.164). Anura marca en formato nacional de 10 digitos
; (caracteristica + abonado), sin 0, sin 15 y sin 54 -- tambien los celulares
; (ver "Llamadas salientes desde Twilio usando Anura" en su KB).
[from-livekit]
; Celular E.164: +54 9 + 10 digitos (el 9 es el prefijo movil internacional).
exten => _+549XXXXXXXXXX,1,Goto(to-anura,${EXTEN:4},1)
; Fijo E.164: +54 + 10 digitos.
exten => _+54XXXXXXXXXX,1,Goto(to-anura,${EXTEN:3},1)
; Lo mismo sin el +.
exten => _549XXXXXXXXXX,1,Goto(to-anura,${EXTEN:3},1)
exten => _54XXXXXXXXXX,1,Goto(to-anura,${EXTEN:2},1)
; Nacional: 0 + 10 digitos, o los 10 digitos pelados.
exten => _0XXXXXXXXXX,1,Goto(to-anura,${EXTEN:1},1)
exten => _XXXXXXXXXX,1,Goto(to-anura,${EXTEN},1)
; Todo lo demas (internacional, numeros cortos, formato desconocido) se
; rechaza con 403: solo se llama a Argentina, y corta de raiz el fraude de
; llamadas internacionales si alguna vez se filtraran las credenciales.
exten => _X.,1,Goto(rejected,s,1)
exten => _+X.,1,Goto(rejected,s,1)

[rejected]
exten => s,1,Verbose(1,Saliente RECHAZADA, destino no argentino o formato desconocido: ${CALLERID(dnid)})
 same => n,Hangup(21)

[to-anura]
; Caller ID: el numero del cliente que manda el agente (sip_number de LiveKit,
; llega como CALLERID(num) en E.164). Anura lo toma de P-Asserted-Identity, en
; el mismo formato que usa en las entrantes: 0 + 10 digitos (confirmado por
; Anura, 29-sep-2026). Tiene que ser un numero de la cuenta.
; Sin caller ID sale con ANURA_DID, la linea propia: la app solo despacha asi la
; saliente de un admin (la de un cliente sin numero propio da 409 no_caller_id).
; Un caller ID que vino pero no es un numero argentino valido se rechaza: no se
; presta ANURA_DID a la llamada de un cliente.
exten => _XXXXXXXXXX,1,Set(CID=${FILTER(0-9,${CALLERID(num)})})
 same => n,ExecIf($[${LEN(${CID})} = 0]?Set(CID=${ANURA_DID}))
 same => n,ExecIf($[${LEN(${CID})} = 13 & "${CID:0:3}" = "549"]?Set(CID=${CID:3}))
 same => n,ExecIf($[${LEN(${CID})} = 12 & "${CID:0:2}" = "54"]?Set(CID=${CID:2}))
 same => n,ExecIf($[${LEN(${CID})} = 11 & "${CID:0:1}" = "0"]?Set(CID=${CID:1}))
 same => n,GotoIf($[${LEN(${CID})} != 10]?badcid)
 same => n,Verbose(1,Saliente a Anura: ${EXTEN} (caller ID ${CID}))
 same => n,Set(CALLERID(num)=${CID})
 same => n,Set(CALLERID(name)=)
 same => n,Dial(PJSIP/${EXTEN}@anura,60,b(anura-predial^s^1(${CID}))L(${CALL_CEILING_MS}))
 same => n,Hangup(${HANGUPCAUSE})
 same => n(badcid),Verbose(1,Saliente RECHAZADA, caller ID invalido: ${CALLERID(num)} -> ${EXTEN})
 same => n,Hangup(21)

; Corre sobre el canal saliente hacia Anura, antes de mandar el INVITE.
; X-Anura-Realm: header que Anura pide para identificar el dominio de la
; cuenta en su doc de troncal saliente (Twilio -> Anura).
; P-Asserted-Identity: numero que ve el destinatario (ARG1, 10 digitos).
[anura-predial]
exten => s,1,Set(PJSIP_HEADER(add,X-Anura-Realm)=${ANURA_DOMAIN})
 same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)=<sip:0${ARG1}@${ANURA_DOMAIN}>)
 same => n,Return()
