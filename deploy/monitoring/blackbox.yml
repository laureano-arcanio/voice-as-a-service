# Sondas de blackbox (docs/OBSERVABILIDAD.md). Los destinos están en prometheus.yml.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
  # El webhook de WhatsApp responde 403 a un token de verificación falso: 403 = llega y contesta.
  http_403:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [403]
  # Un servicio externo que contesta algo (2xx a 4xx): alcanzable, sin importar la ruta.
  http_any:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 204, 301, 302, 400, 401, 403, 404, 405]
  tcp:
    prober: tcp
    timeout: 5s
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
  dns:
    prober: dns
    timeout: 5s
    dns:
      query_name: app.atentina.com.ar
      query_type: A
      preferred_ip_protocol: ip4
