# Balanceador de la inferencia (docs/features/LLM_REPLICAS.md): LLM, STT y TTS pasan por aca. Hoy server2
# atiende solo: la replica de .99 esta fuera del reparto (`disabled`: MAINT, sin trafico ni chequeos).
# Lo levanta docker-compose.llm-lb.yml como servicio `llm-lb`; app y agent le
# hablan por VLLM_LLM_BASE_URL=http://llm-lb:8000/v1, VLLM_STT_BASE_URL=http://llm-lb:8001/v1 y
# VLLM_TTS_BASE_URL=http://llm-lb:8002/v1.
#
# - leastconn: cada pedido nuevo va a la replica con menos pedidos en curso (round robin mandaria la
#   mitad a server2 con el local vacio).
# - Afinidad por conversacion: la primera vez que aparece un X-Atentina-Conversation-Id se elige por
#   leastconn y se anota en la stick-table; los turnos siguientes van a la misma replica, que tiene
#   el historial en su prefix cache (49.000 tokens de KV por 3090). Sin header (API de inferencia,
#   extraccion, pruebas), solo leastconn. Las entradas vencen a las 2 h sin uso: mas que cualquier llamada.
# - Salud: GET /health cada 5 s a cada replica; 2 fallos la sacan, 2 aciertos la vuelven a meter
#   (vllm-llm tarda ~140 s en arrancar; mientras, no recibe nada). Si la conexion falla antes de la
#   respuesta, se reintenta en otra replica activa, si la hay (redispatch). Un stream ya empezado no se reintenta:
#   lo repite el cliente (LLMClient, max_retries=2).
# - timeout server 300 s: un turno largo con herramientas; el cliente corta antes (timeout 30 s).

global
    log stdout format raw local0 info
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-keep-alive
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout http-request 30s
    retries 2
    option redispatch

# DNS de Docker: vllm-llm puede no existir al arrancar (init-addr none) y cambia de IP al recrearse.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold obsolete 30s

frontend fe_llm
    bind :8000
    default_backend llm

frontend fe_stt
    bind :8001
    default_backend stt

frontend fe_tts
    bind :8002
    default_backend tts

backend llm
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 5s fall 2 rise 2 check
    stick-table type string len 64 size 100k expire 2h
    stick on req.hdr(X-Atentina-Conversation-Id) if { req.hdr(X-Atentina-Conversation-Id) -m found }
    server local vllm-llm:8000 resolvers docker init-addr libc,none
    server replica "${LLM_REPLICA_2}" disabled

# STT y TTS no guardan nada entre pedidos: solo leastconn, sin afinidad.
backend stt
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 5s fall 2 rise 2 check
    server local stt-parakeet:8000 resolvers docker init-addr libc,none
    server replica "${STT_REPLICA_2}" disabled

# El talker del TTS puede caerse con el contenedor y /health sanos (INFRA.md): tres 5xx seguidos
# sacan la replica aunque el health check responda; el chequeo la vuelve a meter a los 10 s.
backend tts
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 5s fall 2 rise 2 check observe layer7 error-limit 3 on-error mark-down
    server local vllm-tts:8000 resolvers docker init-addr libc,none
    server replica "${TTS_REPLICA_2}" disabled

# Estado de las replicas (make llm-lb-status; 127.0.0.1:8404 en el host).
frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
