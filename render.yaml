# Render Blueprint: landing estática de Atentina (docs/LANDING.md).
# Astro + Tailwind compilados en el build de Render; la demo llama a la API de
# este server por api.atentina.com.ar (Cloudflare Tunnel).
services:
  - type: web
    name: atentina-landing
    runtime: static
    rootDir: landing            # solo los cambios en landing/ disparan un deploy
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_API_URL
        value: https://api.atentina.com.ar
      - key: PUBLIC_TURNSTILE_SITE_KEY
        sync: false             # site key de Turnstile (Cloudflare), se carga en el dashboard
      - key: PUBLIC_GA_ID
        value: G-VB4V3RVVD3     # Google Analytics 4 (es público: va en el HTML)
    # Dominio canónico. Render agrega www.atentina.com.ar y lo redirige al apex.
    # atentina.com redirige desde Cloudflare y no llega a Render.
    domains:
      - atentina.com.ar
    routes:
      # Las verticales se movieron a /casos-de-uso/<slug> (9-oct-2026).
      - type: redirect
        source: /turnos
        destination: /casos-de-uso/turnos
      - type: redirect
        source: /cobranzas
        destination: /casos-de-uso/cobranzas
      - type: redirect
        source: /municipios
        destination: /casos-de-uso/municipios
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: microphone=(self), camera=(), geolocation=()
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /favicon.svg
        name: Cache-Control
        value: public, max-age=604800
