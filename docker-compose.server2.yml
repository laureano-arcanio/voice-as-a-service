# server2 (192.168.1.98, atentina-region-2): solo vllm-llm, como segunda réplica del LLM de
# producción (desde el 1-nov-2026). Una RTX 3090 sola (índice 0, sin escritorio), mismo modelo,
# misma imagen y mismos flags que el override gemma4-26b. Lo único distinto es el puerto: se publica
# en la IP de la LAN para que el balanceador del server de producción llegue; en producción queda
# en 127.0.0.1. Agente: .claude/agents/server2.md.
# COMPOSE_FILE del .env de server2: docker-compose.yml:docker-compose.gemma4-26b.yml:docker-compose.server2.yml
services:
  vllm-llm:
    ports: !override
      - "192.168.1.98:8101:8000"
