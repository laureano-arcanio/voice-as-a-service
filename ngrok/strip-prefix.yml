# Traffic policy compartida por los 3 agentes ngrok (ngrok-llm/stt/tts):
# reescribe el path publico /llm/... | /stt/... | /tts/... a /v1/... antes de
# reenviarlo al vllm-* upstream.
#
# Hace falta porque ngrok rutea por el prefijo del endpoint
# (https://$NGROK_DOMAIN/llm) pero no lo borra del request: sin esto el vLLM
# recibe /llm/v1/chat/completions y responde 404 en vez de exigir el Bearer.
# El regex matchea contra la URL completa (scheme + host + path), por eso
# `/(llm|stt|tts)/` no puede confundirse con el host.
#
# Si una version futura del agente/cloud de ngrok llegara a sacar el prefijo
# por su cuenta, el regex simplemente no matchea y la policy queda de no-op.
on_http_request:
  - actions:
      - type: url-rewrite
        config:
          from: /(llm|stt|tts)/
          to: /
