# Proxy detras del unico endpoint ngrok de la dev domain. Rutea por path a
# cada vLLM de la red de compose:
#   /llm/... -> vllm-llm:8000
#   /stt/... -> vllm-stt:8000
#   /tts/... -> upstream tts (hoy solo vllm-tts:8000)
#   /stt-parakeet/..., /stt-whisper/... -> ese servicio:8000
#     (STT candidatos, perfil `stt-eval`, ver docker-compose.stt-candidates.yml)
#
# El "/" final del proxy_pass hace que nginx reemplace el prefijo del location:
# /llm/v1/models llega al vLLM como /v1/models (que es lo que espera su router;
# sin esto el upstream recibe /llm/v1/models y responde 404).
# Upstream para poder sumar replicas de TTS (vllm-tts-2, perfil `tts2` del
# compose) cuando tengan GPU propia -- en la misma GPU fue peor, ver compose.
# least_conn porque las sintesis duran ~1-2s y son de largo variable:
# round-robin apila requests largos.
upstream tts {
    least_conn;
    server vllm-tts:8000;
    keepalive 32;
}

server {
    listen 80;

    # Uploads de audio (STT y POST /v1/audio/voices del TTS) pueden superar el
    # default de 1m de nginx.
    client_max_body_size 100m;

    # Streaming de tokens (LLM) y de audio (TTS): sin buffering para que la
    # respuesta no se acumule, y timeout largo para generaciones que tardan.
    proxy_buffering off;
    proxy_read_timeout 300s;

    location /llm/ {
        proxy_pass http://vllm-llm:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stt/ {
        proxy_pass http://vllm-stt:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tts/ {
        proxy_pass http://tts/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Con variable en proxy_pass nginx resuelve el nombre en cada request (DNS
    # de Docker) y no al arrancar: sin esto el proxy no levanta ("host not
    # found in upstream") cuando el perfil stt-eval esta apagado. Si el
    # servicio no esta arriba, ese path da 502 y el resto sigue andando.
    location ~ ^/(stt-parakeet|stt-whisper)/(.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stt_svc $1;
        set $stt_path $2;
        proxy_pass http://$stt_svc:8000/$stt_path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
