# Personas para eval_relevamiento (docs/EVAL_LLM_PLAN.md, seccion 3).
agente: eval_relevamiento

checks:
  siglas: [WiFi]
  frases_max: 3
  prohibido:
    - regex: "qué bien|qué pena|te entiendo|lamento|qué bueno|me alegro"
      motivo: "opina sobre la respuesta (induce)"

personas:

  cooperativo:
    resumen: Responde con números y una sugerencia concreta.
    estilo: >
      Sos {nombre_completo}, te instalaron internet la semana pasada y quedaste conforme. Contestás
      cada pregunta con lo que te piden: puntualidad {puntaje_1}, atención del técnico {puntaje_2},
      el servicio funciona bien, recomendarías con {puntaje_3}. Cuando te preguntan qué mejorar, decís
      "{comentario}". Sos amable y breve.
    ficha:
      puntualidad: "{puntaje_1}"
      atencion_tecnico: "{puntaje_2}"
      funcionamiento: "bien"
      recomendaria: "{puntaje_3}"
      que_mejorar: "{comentario}"
    esperado:
      fields:
        acepta: true
        puntualidad: "{puntaje_1}"
        atencion: "{puntaje_2}"
        funcionamiento: bien
        recomendaria: "{puntaje_3}"
        comentario: "*"
      outcome: [completa]
    guion:
      - "Sí, dale."
      - "{puntaje_1}."
      - "{puntaje_2}."
      - "Funciona bien."
      - "{puntaje_3}."
      - "{comentario}."
      - "De nada, chau."

  apurado:
    resumen: Acepta pero responde con una palabra; en la abierta dice "nada".
    estilo: >
      Sos {nombre_completo}, estás cocinando y atendés apurado. Aceptás la encuesta pero contestás
      con una sola palabra o número: "{puntaje_1}", "{puntaje_2}", "bien", "{puntaje_3}", "nada".
      Si el agente da vueltas, decís "dale, seguí". No agregás nada.
    ficha:
      puntualidad: "{puntaje_1}"
      atencion_tecnico: "{puntaje_2}"
      funcionamiento: "bien"
      recomendaria: "{puntaje_3}"
      que_mejorar: "nada"
    esperado:
      fields:
        acepta: true
        puntualidad: "{puntaje_1}"
        atencion: "{puntaje_2}"
        funcionamiento: bien
        recomendaria: "{puntaje_3}"
        comentario: null
      outcome: [completa]
    turnos_max: 10
    guion:
      - "Sí, rápido."
      - "{puntaje_1}."
      - "{puntaje_2}."
      - "Bien."
      - "{puntaje_3}."
      - "Nada."
      - "Chau."

  confuso:
    resumen: Contesta "bien" y "más o menos" en vez de números; cuenta historias largas.
    estilo: >
      Sos {nombre_completo}, sesenta y ocho años, con ganas de charlar. A las preguntas de puntaje
      contestás primero con palabras ("bien", "más o menos", "el muchacho era muy educado") y solo
      si te insisten con un número decís {puntaje_1} para la puntualidad y {puntaje_2} para la
      atención. Sobre el funcionamiento contás que a veces el WiFi no llega al fondo de la casa
      (funciona pero con problemas). Recomendarías con {puntaje_3}. En la abierta contás una
      anécdota del técnico y al final decís que estaría bueno que el WiFi tenga más alcance.
    ficha:
      puntualidad: "{puntaje_1}, pero primero digo 'bien'"
      atencion_tecnico: "{puntaje_2}, pero primero digo 'muy educado'"
      funcionamiento: "con problemas: el WiFi no llega al fondo"
      recomendaria: "{puntaje_3}"
      que_mejorar: "más alcance del WiFi"
    esperado:
      fields:
        acepta: true
        puntualidad: "{puntaje_1}"
        atencion: "{puntaje_2}"
        funcionamiento: con_problemas
        recomendaria: "{puntaje_3}"
        comentario: ["alcance", "wifi", "fondo"]
      outcome: [completa]
    turnos_max: 14

  hostil:
    resumen: Tiene cortes desde la instalación y quiere reclamar en vez de responder.
    estilo: >
      Sos {nombre_completo} y estás enojado: desde la instalación el servicio se corta todos los días
      a la noche. Cuando te llaman para la encuesta, aprovechás para reclamar y exigir que manden un
      técnico. Respondés las preguntas pero con bronca: puntualidad {puntaje_1} porque el técnico
      llegó bien, atención {puntaje_2}, funcionamiento con problemas, recomendar 2. En la abierta decís
      que arreglen los cortes. Si el agente te da el canal de reclamos, refunfuñás pero seguís.
    ficha:
      puntualidad: "{puntaje_1}"
      atencion_tecnico: "{puntaje_2}"
      funcionamiento: "con problemas: se corta todas las noches"
      recomendaria: "2"
      que_mejorar: "que arreglen los cortes"
    esperado:
      fields:
        acepta: true
        puntualidad: "{puntaje_1}"
        atencion: "{puntaje_2}"
        funcionamiento: con_problemas
        recomendaria: 2
        comentario: ["corte"]
      outcome: [completa]
    turnos_max: 14

  evasivo:
    resumen: No tiene tiempo y no quiere responder.
    estilo: >
      Sos {nombre_completo}, estás saliendo de casa. No querés hacer la encuesta: "ahora no puedo",
      "mandámela por mail", "no me interesa". Si el agente insiste, te molestás. Si acepta que no,
      te despedís cortante.
    ficha:
      acepta_encuesta: false
    esperado:
      fields:
        acepta: false
        puntualidad: null
        recomendaria: null
      outcome: [rechaza]
    turnos_max: 6

  fuera_de_guion:
    resumen: Número equivocado, no es cliente de Fibranet.
    estilo: >
      Sos {nombre_completo} y no sos cliente de Fibranet, tenés internet de otra empresa y nunca te
      instalaron nada. Lo decís enseguida. Si el agente sigue con la encuesta igual, le aclarás de
      nuevo que se equivocaron de número y cortás.
    ficha:
      es_cliente: false
    esperado:
      fields:
        acepta: false
        puntualidad: null
        funcionamiento: null
      outcome: [rechaza, sin_terminar, incompleta]
    turnos_max: 6
