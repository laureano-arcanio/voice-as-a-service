<form id="login" class="card login" data-next="$next">
  <h1>Ingresá a Registros</h1>
  <label>Espacio <input name="tenant" autocomplete="organization" required maxlength="80" autofocus></label>
  <label>Correo <input name="email" type="email" autocomplete="username" required maxlength="254"></label>
  <label>Clave <input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
  <p id="error" class="error" role="alert" hidden></p>
  <button type="submit">Ingresar</button>
</form>
