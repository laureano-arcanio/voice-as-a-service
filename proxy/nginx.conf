# Entrada publica a la inferencia (`make up-nginx`): publicado en
# 0.0.0.0:${PROXY_PORT:-8100} del host, con IP fija. Rutea por path a cada
# servicio de la red de compose:
#   /llm/... -> vllm-llm:8000
#   /stt/... -> stt-parakeet:8000
#   /tts/... -> upstream tts (vllm-tts:8000)
#
# Solo pasan las rutas que usan los clientes reales (app y agent en modo remoto,
# loadtest, eval, make health); el resto da 404 (8-oct-2026). Antes se reenviaba
# todo: /metrics, /v1/completions, /tokenize, POST /v1/audio/voices (subir voces
# al TTS) y los endpoints de admin de vLLM quedaban en internet, con HTTP plano y
# la misma VLLM_API_KEY que viaja sin cifrar. Lista blanca:
#   todos  GET /health, GET /v1/models
#   /llm   POST /v1/chat/completions             (motor, livekit openai.LLM)
#   /stt   POST /v1/audio/transcriptions         (openai.STT, audios de WhatsApp)
#   /tts   POST /v1/audio/speech                 (openai.TTS, previews, WhatsApp)
#          GET  /v1/audio/voices                 (voces servidas, app/voice/worker.py)
# Para sumar una ruta, agregarla al regex de su location.
#
# Los nombres se resuelven en cada request (DNS de Docker, 127.0.0.11), no al
# arrancar. Recrear un servicio le cambia la IP; con resolucion fija nginx
# seguia mandando /llm a la IP vieja, que ya era de otro contenedor (404 en el
# warm-up de EXP-007). Tampoco se podia recargar con un servicio apagado
# ("host not found in upstream"). Si un servicio no esta arriba, su path da
# 502 y el resto sigue andando.
#
# El prefijo del path se saca antes de pasar el request: /llm/v1/models llega
# al vLLM como /v1/models (que es lo que espera su router; sin esto responde 404).
# Upstream para poder sumar replicas de TTS cuando tengan GPU propia (en la
# misma GPU fue peor, EXP-004). least_conn porque las sintesis duran ~1-2s y
# son de largo variable: round-robin apila requests largos.
upstream tts {
    zone tts 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    least_conn;
    server vllm-tts:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_tokens off;

    # Uploads de audio (STT) pueden superar el default de 1m de nginx.
    client_max_body_size 100m;

    # Streaming de tokens (LLM) y de audio (TTS): sin buffering para que la
    # respuesta no se acumule, y timeout largo para generaciones que tardan.
    proxy_buffering off;
    proxy_read_timeout 300s;

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/llm/(health|v1/models|v1/chat/completions)$ {
        set $llm_path $1;
        proxy_pass http://vllm-llm:8000/$llm_path$is_args$args;
    }

    location ~ ^/stt/(health|v1/models|v1/audio/transcriptions)$ {
        set $stt_path $1;
        proxy_pass http://stt-parakeet:8000/$stt_path$is_args$args;
    }

    # GET /v1/audio/voices si, POST (alta de voces) no: limit_except da 403.
    location ~ ^/tts/(v1/audio/voices)$ {
        set $tts_path $1;
        limit_except GET { deny all; }
        proxy_pass http://tts/$tts_path$is_args$args;
        proxy_http_version 1.1;
        # Un proxy_set_header en la location anula los del server: se repiten.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/tts/(health|v1/models|v1/audio/speech)$ {
        set $tts_path $1;
        proxy_pass http://tts/$tts_path$is_args$args;
        proxy_http_version 1.1;
        # Un proxy_set_header en la location anula los del server: se repiten.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
