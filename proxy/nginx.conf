# Entrada a la inferencia por la LAN (`make up-nginx`): publicado en
# 0.0.0.0:${PROXY_PORT:-8100} del host. Lo usan el entorno de desarrollo de
# otro host (docs/DESARROLLO.md), el modo remoto y `make health`. app y agent
# de este host no pasan por aca (van por llm-lb o directo a cada modelo).
#
# Lista blanca: solo las rutas que usa la plataforma (app/services/inference.py,
# app/voice/, dev-health) y solo desde la LAN. La key de vLLM y la del STT
# cubren solo /v1/*: sin la lista, /llm/metrics, /llm/load, /llm/tokenize,
# /llm/invocations o /llm/scale_elastic_ep quedaban abiertos sin clave, y con
# la clave se llegaba a POST/DELETE /v1/audio/voices y /v1/omni/sleep del TTS.
#   /llm/{health,v1/models,v1/chat/completions}     -> vllm-llm:8000
#   /stt/{health,v1/models,v1/audio/transcriptions} -> stt-parakeet:8000
#   /tts/{health,v1/models,v1/audio/speech}         -> upstream tts
#   GET /tts/v1/audio/voices                        -> upstream tts
# Lo demas da 404 (o 405 en otro metodo sobre /tts/v1/audio/voices). Un origen
# fuera de loopback y rangos privados da 403: segunda linea si el router
# reenviara el puerto (la primera es que no lo reenvia).
#
# Los nombres se resuelven en cada request (DNS de Docker, 127.0.0.11), no al
# arrancar. Recrear un servicio le cambia la IP; con resolucion fija nginx
# seguia mandando /llm a la IP vieja, que ya era de otro contenedor (404 en el
# warm-up de EXP-007). Tampoco se podia recargar con un servicio apagado
# ("host not found in upstream"). Si un servicio no esta arriba, su path da
# 502 y el resto sigue andando.
#
# El prefijo del path se saca antes de pasar el request: /llm/v1/models llega
# al vLLM como /v1/models (que es lo que espera su router; sin esto responde 404).
# Upstream para poder sumar replicas de TTS cuando tengan GPU propia (en la
# misma GPU fue peor, EXP-004). least_conn porque las sintesis duran ~1-2s y
# son de largo variable: round-robin apila requests largos.
upstream tts {
    zone tts 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    least_conn;
    server vllm-tts:8000 resolve;
    keepalive 32;
}

server {
    listen 80;

    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    # Uploads de audio del STT pueden superar el default de 1m de nginx.
    client_max_body_size 100m;

    # Streaming de tokens (LLM) y de audio (TTS): sin buffering para que la
    # respuesta no se acumule, y timeout largo para generaciones que tardan.
    proxy_buffering off;
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/llm/(health|v1/models|v1/chat/completions)$ {
        set $llm_path $1;
        proxy_pass http://vllm-llm:8000/$llm_path$is_args$args;
    }

    location ~ ^/stt/(health|v1/models|v1/audio/transcriptions)$ {
        set $stt_path $1;
        proxy_pass http://stt-parakeet:8000/$stt_path$is_args$args;
    }

    location ~ ^/tts/(health|v1/models|v1/audio/speech)$ {
        set $tts_path $1;
        proxy_pass http://tts/$tts_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Listar voces si; crearlas o borrarlas (POST/DELETE) no.
    location = /tts/v1/audio/voices {
        if ($request_method != GET) {
            return 405;
        }
        proxy_pass http://tts/v1/audio/voices$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
