# TTS fine-tuneado: Qwen3-TTS-12Hz-1.7B-Base + SFT de una voz (docs/TTS_FINETUNE.md).
# El checkpoint es tipo custom_voice: la voz va por nombre, sin audio de referencia.
#   TTS_FT_CKPT   carpeta del checkpoint (default: arf_03034, datos limpios, lr 2e-6, epoca 5)
#   TTS_FT_VOICE  nombre de la voz dentro del checkpoint (--speaker_name de train.py)
#
# Uso (sobre la config de Parakeet vigente):
#   docker compose -f docker-compose.yml -f docker-compose.parakeet.yml -f docker-compose.tts-ft.yml \
#     --profile stt-eval up -d --wait vllm-llm stt-parakeet vllm-tts agent
# Cambiar solo de checkpoint: el mismo comando con `up -d --wait vllm-tts` (el agente no cambia
# si la voz es la misma). Volver a sofia_ar: el mismo comando sin `-f docker-compose.tts-ft.yml`.
services:
  vllm-tts:
    command:
      - "vllm"
      - "serve"
      - "/models/ft"
      - "--served-model-name=${TTS_FT_VOICE:-arf_03034}-ft"
      - "--omni"
      - "--host=0.0.0.0"
      - "--port=8000"
      - "--api-key=${VLLM_API_KEY:-not-needed}"
      - "--gpu-memory-utilization=0.4"
      - "--max-model-len=4096"
    volumes: !override
      - ${TTS_FT_CKPT:-./tts/finetune/work/runs/arf_03034/lr2e-6/checkpoint-epoch-5}:/models/ft:ro
      # Volumen propio: el de siempre restauraria sofia_ar (voz clonada, task Base)
      # sobre un checkpoint custom_voice.
      - vllm_tts_speakers_ft:/root/.cache/vllm-omni/speakers

  agent:
    environment:
      VLLM_TTS_MODEL: ${TTS_FT_VOICE:-arf_03034}-ft
      VLLM_TTS_VOICE: ${TTS_FT_VOICE:-arf_03034}

volumes:
  vllm_tts_speakers_ft:
