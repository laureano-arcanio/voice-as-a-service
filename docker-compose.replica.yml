# Replica de inferencia (docs/features/LLM_REPLICAS.md): este host corre solo LLM, STT y TTS, para el
# balanceador del server principal. Publica los modelos en la LAN (la auth es VLLM_API_KEY, como en el
# principal) y deja afuera el resto del stack con un perfil: `docker compose up` y deploy/boot.sh levantan
# solo los modelos. Nunca dos Asterisk, dos cloudflared ni dos agent (MIGRACION_SERVER.md).
# COMPOSE_FILE: docker-compose.yml:docker-compose.gemma4-26b.yml:docker-compose.gpu-3080ti.yml:docker-compose.replica.yml
# Hace falta en .env: STACK_ROLE=replica (lo mira el Makefile) y REPLICA_BIND_IP.
x-fuera-de-la-replica: &fuera
  profiles: ["fuera-de-la-replica"]

services:
  vllm-llm:
    ports: !override
      - "127.0.0.1:8101:8000"
      - "${REPLICA_BIND_IP:?falta REPLICA_BIND_IP en .env}:8101:8000"
  stt-parakeet:
    ports: !override
      - "127.0.0.1:8102:8000"
      - "${REPLICA_BIND_IP:?falta REPLICA_BIND_IP en .env}:8102:8000"
  vllm-tts:
    ports: !override
      - "127.0.0.1:8103:8000"
      - "${REPLICA_BIND_IP:?falta REPLICA_BIND_IP en .env}:8103:8000"

  db: *fuera
  migrate: *fuera
  app: *fuera
  crm: *fuera
  agent: *fuera
  tools-runner: *fuera
  tools-egress: *fuera
  proxy: *fuera
  asterisk: *fuera
