# LiveKit propio en este host (desarrollo), en lugar de LiveKit Cloud: rooms,
# despacho del agente y SIP para Asterisk. Motivo: en el plan gratuito de Cloud
# el despacho deja jobs en JS_PENDING con ~20-24 llamadas (EXP-011).
#
# Se activa con COMPOSE_FILE=docker-compose.yml:docker-compose.livekit.yml en
# .env, asi `make up` y el resto de los targets lo incluyen. Las LIVEKIT_* de
# .env (URL, claves, SIP) son las de este LiveKit: app, agent y asterisk las
# toman sin pisar nada aca. Ver docs/TELEFONIA_ANURA.md, seccion 7.
#
# livekit y livekit-sip van con network_mode: host, como asterisk: SIP y RTP
# no pasan bien por el NAT de docker. Puertos (no chocan con asterisk, que usa
# 5080/5081 y RTP 10000-10199):
#   livekit      7880/tcp senalizacion, 7881/tcp y 7882/udp WebRTC
#   livekit-sip  5060/udp SIP, RTP 20000-20199
#   redis        127.0.0.1:6380 (6379 queda libre para otros proyectos)

services:
  livekit-redis:
    # Imagenes fijadas por digest (8-oct-2026; tag en el nombre, ignorado al resolver).
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    network_mode: host
    # Con persistencia (AOF en el volumen, fsync por segundo): sin ella, un reinicio de
    # Redis o del host borraba los trunks SIP y la dispatch rule, y las entrantes daban 486
    # "flood" hasta correr `make livekit-sip` (26-sep-2026). boot.sh y healthcheck.sh lo
    # siguen corriendo igual (idempotente). Sin RDB (--save ""): el AOF alcanza.
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6380", "--save", "",
              "--appendonly", "yes", "--appendfsync", "everysec", "--dir", "/data"]
    volumes:
      - livekit_redis_data:/data

  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?falta LIVEKIT_API_KEY en .env}: ${LIVEKIT_API_SECRET:?falta LIVEKIT_API_SECRET en .env}"
      # IP que se anuncia en los candidatos ICE. Sin LIVEKIT_NODE_IP, la de la LAN
      # (contenedores de este host y la PC del loadtest). Con la IP publica, entran
      # tambien los navegadores de la landing; advertise_internal_ip (livekit.yaml)
      # sigue anunciando la de la LAN para los clientes locales.
      NODE_IP: ${LIVEKIT_NODE_IP:-${LIVEKIT_LOCAL_NODE_IP:?falta LIVEKIT_LOCAL_NODE_IP en .env}}
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - livekit-redis

  livekit-sip:
    image: livekit/sip:v1.17.0@sha256:d3c6441eb0918a81ab9e48ba7df6f02c1eebbeace42c963b2c6a6e5418675671
    restart: unless-stopped
    network_mode: host
    environment:
      # Asterisk esta en el mismo host: el tramo Asterisk <-> LiveKit es local,
      # sin NAT (use_external_ip: false).
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6380
        sip_port: 5060
        rtp_port: 20000-20199
        use_external_ip: false
        logging:
          level: info
    depends_on:
      - livekit

  app:
    environment:
      # Para `make livekit-sip`: el trunk saliente apunta a Asterisk en este
      # host, no a la IP publica que ve Anura.
      LIVEKIT_SIP_OUTBOUND_ADDRESS: 127.0.0.1:${ASTERISK_SIP_PORT:-5080}

volumes:
  # AOF del Redis de LiveKit (trunks SIP, dispatch rule, rooms).
  livekit_redis_data:
