services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Host-only, for connecting a local MySQL client/GUI during the demo.
      # Not needed by the app itself (it talks to `db` over the compose network).
      - "127.0.0.1:3306:3306"
    healthcheck:
      # --protocol=tcp is deliberate: without it, mysqladmin can connect via the
      # local socket to MySQL's *temporary* init-phase server and report healthy
      # before the real server is listening on 3306 for the app to reach.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Solo vllm-llm: /rescore (app/main.py) llama a scoring.py, que le pega
      # al LLM. No usa STT/TTS directo (eso lo hace el worker `agent`).
      vllm-llm:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides the DB_DSN in .env (that one targets 127.0.0.1, for the bare-metal
      # systemd deployment described in README.md) so the container talks to the
      # `db` service by its compose network hostname instead.
      DB_DSN: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?charset=utf8mb4
    ports:
      - "8011:8011"
    volumes:
      - ./storage:/app/storage

  agent:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      vllm-llm:
        condition: service_healthy
      stt-parakeet:
        condition: service_healthy
      vllm-tts:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_DSN: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?charset=utf8mb4
    command: ["python", "-m", "app.livekit_agent", "start"]
    # The image's HEALTHCHECK probes the FastAPI app's /health over HTTP, which
    # this service doesn't serve (it's a worker process, no HTTP port) -- disable
    # it here so `docker compose ps` doesn't show a misleading "unhealthy".
    healthcheck:
      disable: true
    # El default del contenedor (1024 fds) se queda corto para el load test
    # (scripts/loadtest/, `make loadtest`): cada VirtualCaller concurrente abre
    # varios sockets (WebRTC + señalización) por room -- probado en vivo, con
    # ~18 llamadas concurrentes tira "Too many open files" y las conexiones
    # fallan en cascada. Se sube acá (no solo en el comando del load test)
    # porque `docker compose run` no soporta pasar --ulimit por flag.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # --- Inferencia local, GPU-only ----------------------------------------
  # LLM, STT y TTS con API compatible con OpenAI. `app` y `agent` les hablan con
  # los plugins livekit.plugins.openai, apuntando base_url a cada uno. Requieren
  # NVIDIA Container Toolkit en el host (scripts/install-nvidia-toolkit.sh).
  #
  # Reparto en las 2x RTX 3090 (24GB c/u) de este host (EXP-003 y EXP-008):
  #   GPU 0: vllm-tts sola. TTS satura su GPU por si solo y es el cuello de
  #          latencia: no comparte, ni con otra replica (EXP-001 a 004).
  #   GPU 1: vllm-llm (0.55) + stt-parakeet (~1.6GB) + escritorio (~1.4GB).
  # --gpu-memory-utilization es una reserva FIJA (fraccion de la memoria TOTAL
  # de esa GPU), y vLLM sigue capturando CUDA graphs bajo trafico (ver
  # --max-cudagraph-capture-size abajo): los que comparten GPU tienen que sumar
  # bien por debajo de 1.0. Revisar con `nvidia-smi` si se agrega algo.

  vllm-llm:
    # LLM conversacional: Qwen3.5-4B (dense, cabe en 16GB+). API OpenAI-compatible
    # completa (/v1/chat/completions y /v1/responses) -- swap directo del
    # openai.responses.LLM que ya usa app/livekit_agent.py, solo cambiando base_url.
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ipc: host
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
      - "--model=${VLLM_LLM_MODEL:-Qwen/Qwen3.5-4B}"
      - "--served-model-name=${VLLM_LLM_MODEL:-Qwen/Qwen3.5-4B}"
      - "--host=0.0.0.0"
      - "--port=8000"
      # El server exige esta clave como `Authorization: Bearer` en /v1/*
      # (health queda libre). app/agent ya mandan VLLM_API_KEY; si se expone
      # por el proxy usar una clave real en .env (ver .env.example).
      - "--api-key=${VLLM_API_KEY:-not-needed}"
      - "--max-model-len=32768"
      - "--reasoning-parser=qwen3"
      # Comparte la GPU 1 con stt-parakeet (~1.6GB) y el escritorio (~1.4GB). Pesos
      # 8.6GiB + ~2.7GiB de overhead: 0.55 (~13.2GiB) deja ~1.9GiB de KV cache.
      # Con 0.75 el KV cache (7GiB) nunca paso de 7% de uso bajo 32 sesiones.
      - "--gpu-memory-utilization=0.55"
      # Qwen3.5 es arquitectura hibrida Mamba+Attention: con menos memoria hay
      # menos "bloques de cache Mamba" disponibles, y el max_num_seqs default
      # (256) no entra -- CUDA graph capture falla ("max_num_seqs exceeds
      # available Mamba cache blocks"). Esta demo nunca tiene tantas llamadas
      # concurrentes; 32 alcanza de sobra.
      - "--max-num-seqs=32"
      # Sin esto, vLLM sigue capturando CUDA graphs nuevos (para tamanos de
      # batch no vistos todavia) a medida que van llegando requests reales, y
      # la memoria real usada crece con el trafico bien por encima de lo que
      # calcula gpu-memory-utilization al arrancar en frio (medido: 10.7GB en
      # frio -> 16.6GB tras unos pocos requests, con 0.5 y sin este limite).
      # Con max-num-seqs=32 no hace falta capturar mas alla de ese tamano.
      - "--max-cudagraph-capture-size=32"
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      # Host-only, para debug/curl manual. app/agent le hablan por la red de
      # compose (http://vllm-llm:8000), no por este puerto de host.
      - "127.0.0.1:8101:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Descarga de pesos + carga en GPU puede tardar varios minutos la primera vez.
      start_period: 300s

  stt-parakeet:
    # STT: NVIDIA Parakeet TDT 0.6B v3 (FastConformer + TDT, 25 idiomas europeos
    # con deteccion automatica; no acepta pista de idioma). vLLM no lo sirve:
    # corre en stt/server.py via transformers (AutoModelForTDT), sin NeMo, con
    # batching dinamico (STT_MAX_BATCH) y /metrics con nombres de vLLM para el
    # sampler. Reemplazo a Qwen3-ASR-1.7B (EXP-007/008): 101-130 ms con 1,6GB,
    # contra 7GB de Qwen3-ASR. Endpoint REST por turno
    # (/v1/audio/transcriptions), sin parciales.
    build: ./stt
    restart: unless-stopped
    # Comparte la GPU 1 con vllm-llm: arranca despues para no competir por la
    # memoria libre al cargar (si arrancan a la vez, uno falla el primer intento
    # y `compose up` da por fallido al dependiente).
    depends_on:
      vllm-llm:
        condition: service_healthy
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      STT_MODEL: nvidia/parakeet-tdt-0.6b-v3
      STT_API_KEY: ${VLLM_API_KEY:-not-needed}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8102:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s

  vllm-tts:
    # TTS: Qwen3-TTS-12Hz-1.7B-Base con fine-tuning de una voz (arf_03034,
    # docs/TTS_FINETUNE.md), servido con vLLM-Omni (`--omni`). El checkpoint es
    # tipo custom_voice: la voz va por nombre (VLLM_TTS_VOICE), sin audio de
    # referencia. Para servir otro checkpoint: TTS_FT_CKPT, VLLM_TTS_MODEL
    # (<voz>-ft) y VLLM_TTS_VOICE en .env, y `make up-inference`.
    # Descartados: 0.6B-Base (~1% de pedidos sin fin de audio, 47 s generando),
    # CosyVoice 3 (0,6-1 s de primer audio con una llamada) y el -CustomVoice
    # de fabrica (ninguna voz suena argentina y clonar con el rompe el engine).
    #
    # OJO: fijar version, NO usar :latest -- latest (v0.29.0rc1, sep-2026) trae
    # un vllm interno (0.28.0) desalineado con vllm_omni (0.29.0rc1) y no arranca
    # (ModuleNotFoundError: vllm.entrypoints.launchers). v0.28.0 es la ultima
    # release donde ambas versiones coinciden. Revisar tags nuevos en
    # https://hub.docker.com/r/vllm/vllm-omni/tags antes de subir esta version.
    image: vllm/vllm-omni:v0.28.0
    restart: unless-stopped
    ipc: host
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    # Esta imagen no trae ENTRYPOINT/CMD propios (a diferencia de vllm-openai) --
    # hay que pasar el binario completo.
    command:
      - "vllm"
      - "serve"
      - "/models/ft"
      - "--served-model-name=${VLLM_TTS_MODEL:-arf_03034-ft}"
      - "--omni"
      - "--host=0.0.0.0"
      - "--port=8000"
      # Ver comentario del --api-key en vllm-llm.
      - "--api-key=${VLLM_API_KEY:-not-needed}"
      # Sola en la GPU 0 (ver reparto arriba). El uso maximo de KV cache medido
      # con 32 sesiones fue 5%; sobra, pero no hay con quien compartir la GPU.
      - "--gpu-memory-utilization=0.4"
      # El default (auto) carga un segundo modelo interno (el decoder Code2Wav)
      # con max_model_len=65536, de sobra para sintetizar una frase. Acotarlo
      # baja el uso real de memoria bajo carga.
      - "--max-model-len=4096"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ${TTS_FT_CKPT:-./tts/finetune/work/runs/arf_03034/lr2e-6/checkpoint-epoch-5}:/models/ft:ro
      # Voces subidas por POST /v1/audio/voices. Volumen propio: el de la voz
      # clonada anterior (vllm_tts_speakers) restauraria sofia_ar (task Base)
      # sobre un checkpoint custom_voice.
      - vllm_tts_speakers_ft:/root/.cache/vllm-omni/speakers
    ports:
      - "127.0.0.1:8103:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s

  # --- Exposicion publica de la inferencia --------------------------------
  # Un solo puerto en la IP fija del host (PUBLIC_HOST en .env; el router
  # redirige PROXY_PORT a este host) y nginx rutea por path a la red de compose,
  # sacando el prefijo antes de reenviar (proxy/nginx.conf):
  #   http://$PUBLIC_HOST:$PROXY_PORT/llm/v1   (LLM)
  #   http://$PUBLIC_HOST:$PROXY_PORT/stt/v1   (STT)
  #   http://$PUBLIC_HOST:$PROXY_PORT/tts/v1   (TTS)
  # Lo usa el loadtest desde otra PC. Los puertos 127.0.0.1:810x siguen siendo
  # solo para debug local. La auth la hace cada servicio con --api-key: el
  # caller manda `Authorization: Bearer ${VLLM_API_KEY}`. Es HTTP plano: la
  # clave viaja sin cifrar. Sin depends_on: nginx resuelve cada servicio en cada
  # request y da 502 solo en el path del que este apagado.
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PROXY_PORT:-8100}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # --- Telefonia: Asterisk entre Anura y LiveKit (perfil `pbx`, opt-in) ----
  # Puente SIP: registra la troncal de Anura (asi recibe las entrantes y las
  # pasa a LiveKit) y recibe de LiveKit las salientes que marca el agente para
  # mandarlas a Anura. Arquitectura, port forwarding y runbook completo en
  # docs/TELEFONIA_ANURA.md. Requiere ANURA_*/LIVEKIT_SIP_* en .env y el port
  # forwarding del router.
  #
  # network_mode: host a proposito. SIP + RTP detras de NAT ya es delicado; con
  # la red bridge de compose se suma el NAT de Docker (reescribe puertos de
  # origen y rompe la asociacion SIP/RTP) y habria que publicar 200 puertos
  # UDP uno por uno. En host, Asterisk escucha directo en la IP de la LAN y
  # anuncia la IP publica (pjsip.conf). Por lo mismo no usa la red de compose:
  # no le habla a ningun otro servicio del stack, solo a Anura y a LiveKit Cloud.
  asterisk:
    build: ./asterisk
    restart: unless-stopped
    network_mode: host
    # Solo lo que usan los templates de asterisk/conf/ (no env_file: .env,
    # para no meterle al contenedor las claves de MySQL/LiveKit/vLLM).
    environment:
      TZ: America/Argentina/Buenos_Aires
      ANURA_DOMAIN: ${ANURA_DOMAIN:-}
      ANURA_USER: ${ANURA_USER:-}
      ANURA_PASSWORD: ${ANURA_PASSWORD:-}
      ANURA_DID: ${ANURA_DID:-}
      LIVEKIT_SIP_HOST: ${LIVEKIT_SIP_HOST:-}
      LIVEKIT_SIP_PASSWORD: ${LIVEKIT_SIP_PASSWORD:-}
      ASTERISK_PUBLIC_ADDRESS: ${ASTERISK_PUBLIC_ADDRESS:-}
      ASTERISK_SIP_PORT: ${ASTERISK_SIP_PORT:-5080}
      ASTERISK_ANURA_SIP_PORT: ${ASTERISK_ANURA_SIP_PORT:-5081}
      ASTERISK_RTP_START: ${ASTERISK_RTP_START:-10000}
      ASTERISK_RTP_END: ${ASTERISK_RTP_END:-10199}
    volumes:
      # Templates: entrypoint.sh los renderiza a /etc/asterisk al arrancar, asi
      # que un cambio en asterisk/conf/ se aplica con `make up-pbx`, sin rebuild.
      - ./asterisk/conf:/etc/asterisk/templates:ro
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
  # Cache de pesos de HuggingFace compartido por la inferencia, para no volver
  # a descargar varios GB cada vez que se recrea un contenedor.
  hf_cache:
  # Voces de vllm-tts (ver comentario del servicio).
  vllm_tts_speakers_ft:
